# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Go module dependencies in go.mod. Ebitengine and the TinyGo drivers
  # are the only direct ones.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"

  # The actions used by .github/workflows/ci.yml, which otherwise go
  # stale until a runner deprecation warning points it out.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
