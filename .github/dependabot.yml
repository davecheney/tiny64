# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Go module dependencies in go.mod. The TinyGo drivers and the PIO
  # library are the only direct ones; SDL2 is a system package, not a
  # module, so nothing here tracks it.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"

  # The actions used by .github/workflows/ci.yml, which otherwise go
  # stale until a runner deprecation warning points it out.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
