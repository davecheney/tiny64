name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      # The physical 1541 is behind a build tag, so the steps above do not
      # compile it, its GCR codec, its two VIAs, or the 6502 core they hang
      # off - nor the 6502 arm of the IRQ suite, which is the only non-6510
      # core under test anywhere. That is 252 test cases the default
      # configuration cannot see. This pass is what keeps them honest, and
      # it has to stay next to the untagged one: between them they are the
      # only coverage either configuration gets.
      - name: Build (1541)
        run: go build -tags drive1541 ./...

      - name: Test (1541)
        run: go test -tags drive1541 ./...

      - name: Vet (1541)
        run: go vet -tags drive1541 ./...

      # The desktop frontend has a second backend, on SDL2 instead of
      # Ebitengine, because Ebitengine reaches TinyGo through purego, whose
      # func.go needs reflect.Value.SetPointer and TinyGo's reflect has no
      # such method. It is behind the sdl tag, so none of the steps above
      # compile it, its cgo shim, or its copy of the keyboard map.
      #
      # This pass runs the standard toolchain over it rather than TinyGo.
      # That is deliberate: both compile the same files, and an error in
      # the shim surfaces here as an ordinary Go error instead of one from
      # a compiler with its own cgo implementation. TinyGo itself is not
      # installed on the runner - what it can build is checked by hand.
      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: Build (sdl)
        run: go build -tags sdl ./...

      # The desktop tests are the only ones the tag changes, and neither of
      # the two it selects needs a display: one checks the keyboard map
      # covers the matrix, the other that SDL's RGBA32 really is byte-order
      # RGBA, which is what lets a frame upload without repacking.
      - name: Test (sdl)
        run: go test -tags sdl ./cmd/internal/desktop

      - name: Vet (sdl)
        run: go vet -tags sdl ./...

      # There's no golangci-lint in the repo yet, so "lint" is what the
      # standard toolchain offers: vet, plus a formatting check, written
      # out longhand because gofmt -l only lists offending files and
      # exits 0 regardless.
      - name: Lint
        run: |
          go vet ./...
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi
