name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Ebitengine's GLFW binding is cgo and needs X11/OpenGL development
      # headers, which ubuntu-latest doesn't carry by default. Only the
      # desktop frontend pulls this in; the emulator core doesn't.
      - name: Install Ebitengine build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      # There's no golangci-lint in the repo yet, so "lint" is what the
      # standard toolchain offers: vet, plus a formatting check, written
      # out longhand because gofmt -l only lists offending files and
      # exits 0 regardless.
      - name: Lint
        run: |
          go vet ./...
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi
